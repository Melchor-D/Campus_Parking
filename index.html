<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="loader" class="loader">
    <div class="spinner"></div>
    <p>Cargando...</p>
  </div>

  <div id="login-container">  
    <div class="login-card">
      <h2>Iniciar Sesión</h2>

      <input id="email" type="email" placeholder="Correo">
      <input id="password" type="password" placeholder="Contraseña">

      <button onclick="login()">Ingresar</button>

      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="app" class="hidden">
    <nav class="navbar">
      <h2>Parking</h2>
      <ul>
        <li onclick="openProfile()">Perfil</li>
        <li onclick="loadView('dashboard')">Dashboard</li>
        <li onclick="loadView('parqueo')">Parqueo</li>
        <li onclick="loadView('historial')">Historial</li>
        <li onclick="logout()">Salir</li>
      </ul>
    </nav>

    <main id="view"></main>
  </div>

<div id="modalPerfil" class="modal hidden">
  <div class="modal-content">
    <h2>Editar Perfil</h2>

    <label>Nombre</label>
    <input id="perfilNombre" type="text">

    <label>Correo</label>
    <input id="perfilCorreo" type="email">

    <label>Nueva contraseña</label>
    <input id="perfilPass" type="password" placeholder="Dejar vacío si no cambia">

    <button onclick="guardarPerfil()">Guardar cambios</button>
    <button class="btn-cerrar" onclick="closeProfile()">Cerrar</button>
  </div>
</div>


<div id="modalEditar" class="modal hidden">
  <div class="modal-content">
    <h2>Editar Vehículo</h2>
    <input type="hidden" id="editId">
    <label>Placa</label>
    <input id="editPlaca" type="text">
    <label>Tipo</label>

    <select id="editTipo">
      <option value="carro">Carro</option>
      <option value="moto">Moto</option>
      <option value="bici">Bici</option>
    </select>

    <label>Espacio</label>
    <input id="editSlot" type="number">

    <label>Tarifa</label>
    <input id="editTarifa" type="number">

    <button onclick="guardarEdicion()">
      Guardar cambios
    </button>
    <button class="btn-cerrar"
      onclick="cerrarModalEditar()">
      Cancelar
    </button>
  </div>
</div>

  <script src="storage.js"></script>
  <script src="components.js"></script>
  <script src="app.js"></script>
  <script src="login.js"></script>

  
</body>
</html>
